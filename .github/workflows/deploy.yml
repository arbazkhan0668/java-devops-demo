name: Build and deploy to EC2

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Build application
        run: mvn --batch-mode clean package

      - name: Configure SSH
        env:
          EC2_SSH_PRIVATE_KEY: ${{ secrets.EC2_SSH_PRIVATE_KEY }}
          EC2_KNOWN_HOSTS: ${{ secrets.EC2_KNOWN_HOSTS }}
        run: |
          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$EC2_SSH_PRIVATE_KEY" > "$HOME/.ssh/ec2_key"
          chmod 600 "$HOME/.ssh/ec2_key"
          printf '%s\n' "$EC2_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"

      - name: Copy application to EC2
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
        run: |
          scp -i "$HOME/.ssh/ec2_key" \
            -o StrictHostKeyChecking=yes \
            target/java-devops-demo.jar \
            "$EC2_USER@$EC2_HOST:/tmp/java-devops-demo.jar"

      - name: Install and restart application
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
        run: |
          ssh -i "$HOME/.ssh/ec2_key" \
            -o StrictHostKeyChecking=yes \
            "$EC2_USER@$EC2_HOST" \
            'sudo install -o java-demo -g java-demo -m 0644 /tmp/java-devops-demo.jar /opt/java-demo/java-devops-demo.jar && sudo rm /tmp/java-devops-demo.jar && sudo systemctl restart java-demo && sudo systemctl is-active --quiet java-demo'
